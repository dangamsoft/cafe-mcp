name: Publish to MCP Registry

# Publishes server.json to the official registry (registry.modelcontextprotocol.io)
# via GitHub OIDC — no secrets required. The npm package @dangamsoft/cafe-mcp is
# published out-of-band; the registry only verifies that the version referenced in
# server.json is already live on npm, so publish to npm BEFORE pushing the tag.
#
# Trigger:  git tag v0.6.3 && git push origin v0.6.3   (or run manually from Actions)
#
# validate job runs on every PR (that touches server.json/this workflow) and on
# manual dispatch — schema-checks server.json WITHOUT publishing. The publish job
# only runs on a v* tag push, and only after validate passes.

on:
  push:
    tags: ["v*"]        # e.g. v0.6.3
  pull_request:
    paths:
      - "server.json"
      - ".github/workflows/publish-mcp.yml"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate ./server.json

  publish:
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write   # required for GitHub OIDC auth to the registry
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 2026-11-22 npm (2.x stdio bridge) is published here too, before the registry step that checks it.
      #   No token needed: npm Trusted Publishing (OIDC, this job has id-token: write). One-time setup on npmjs.com:
      #   package Settings > Trusted Publisher > GitHub Actions · dangamsoft / cafe-mcp · publish-mcp.yml.
      #   NPM_TOKEN secret also works. Skipped when that version is already on npm (published from the PC).
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
      - run: npm ci
      - run: npm test
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$PKG_VERSION" ] || { echo "tag v$VERSION != package.json $PKG_VERSION"; exit 1; }
          if npm view "@dangamsoft/cafe-mcp@$VERSION" version >/dev/null 2>&1; then echo "npm $VERSION already published"; exit 0; fi
          npm publish --access public || { echo "npm publish failed: set up Trusted Publishing on npmjs.com (see the comment above) or publish from the PC"; exit 1; }

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # Keep server.json (and its npm package ref) in sync with the pushed tag.
      # The matching npm version MUST already be live on npm for publish to pass.
      - name: Sync server.json version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # 2026-10-18: remote-only (no npm package) — only touch .packages when it exists
          jq --arg v "$VERSION" '.version = $v | if .packages then .packages |= map(.version = $v) else . end' server.json > server.tmp
          mv server.tmp server.json
          echo "server.json set to version $VERSION"

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
