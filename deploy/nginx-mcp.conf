# /etc/nginx/sites-available/mcp.24plus.ai.kr  (cafe-svr)
# DNS: A record mcp.24plus.ai.kr -> cafe-svr public IP. TLS: certbot --nginx -d mcp.24plus.ai.kr
server {
    listen 80;
    server_name mcp.24plus.ai.kr;

    client_max_body_size 64k;

    location = /mcp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location = /health { proxy_pass http://127.0.0.1:8787; }
    location = /       { proxy_pass http://127.0.0.1:8787; }
    location / { return 404; }
}
